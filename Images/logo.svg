<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bgS" cx="35%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A2722"/>
      <stop offset="100%" stop-color="#101A16"/>
    </radialGradient>
    <linearGradient id="greenS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#00A865"/>
    </linearGradient>
    <linearGradient id="cyanS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
    <filter id="shadowS" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bgS)"/>

  <!-- Left: Big Stream Orbit & Speed Chevron Glyph (Center: 215, 225, Radius: 100) -->
  <g transform="translate(215, 225)" filter="url(#shadowS)">
    <circle cx="0" cy="0" r="100" fill="#0D1814" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" stroke-dasharray="26 8 44 8"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5" stroke-dasharray="18 8 36 6"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5"/>

    <!-- Green & Cyan Acceleration Rays -->
    <path d="M -66 -34 A 75 75 0 0 1 -22 72" fill="none" stroke="url(#greenS)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-66" cy="-34" r="4.2" fill="#00F59B"/>

    <path d="M 66 34 A 75 75 0 0 1 22 -72" fill="none" stroke="url(#cyanS)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="66" cy="34" r="4.2" fill="#00F5D4"/>

    <!-- Center Speed Capsule -->
    <circle cx="0" cy="0" r="40" fill="url(#greenS)" stroke="#70FFD0" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Fast-Forward Chevrons (>> Speed & Instant Start) -->
    <g transform="translate(-1, 0)">
      <path d="M -16 -18 L 2 0 L -16 18" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 3 -18 L 21 0 L 3 18" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Right: Bold Typography -->
  <g transform="translate(365, 225)">
    <text x="0" y="6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, 'PingFang SC', sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      Strm<tspan fill="#00F59B">Tool</tspan>
    </text>
    <text x="4" y="58" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="600" fill="#88A79B" letter-spacing="6">
      流媒体增强工具
    </text>
  </g>
</svg>
